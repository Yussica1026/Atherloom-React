name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/android-apk]
    tags: ["v*"]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Build React assets
        run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run release and security contracts
        run: >-
          python -m unittest
          android.tests.test_provider_http_policy
          android.tests.test_voice_contract
          tests.react_casual_games_contracts
          tests.react_longworld_contracts
          tests.react_regression_contracts
          tests.release_contracts
          -v
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Compile fixed-signature release APK
        working-directory: android
        shell: bash
        env:
          ATHERLOOM_KEYSTORE_BASE64: ${{ secrets.ATHERLOOM_KEYSTORE_BASE64 }}
          ATHERLOOM_STORE_PASSWORD: ${{ secrets.ATHERLOOM_STORE_PASSWORD }}
          ATHERLOOM_KEY_ALIAS: ${{ secrets.ATHERLOOM_KEY_ALIAS }}
          ATHERLOOM_KEY_PASSWORD: ${{ secrets.ATHERLOOM_KEY_PASSWORD }}
        run: |
          if [ -z "$ATHERLOOM_KEYSTORE_BASE64" ] || [ -z "$ATHERLOOM_STORE_PASSWORD" ] || [ -z "$ATHERLOOM_KEY_ALIAS" ] || [ -z "$ATHERLOOM_KEY_PASSWORD" ]; then
            echo "::error title=Signing secrets missing::Configure all four ATHERLOOM signing secrets before building."
            exit 1
          fi
          export ATHERLOOM_KEYSTORE_FILE="$RUNNER_TEMP/atherloom-release.p12"
          printf '%s' "$ATHERLOOM_KEYSTORE_BASE64" | base64 --decode > "$ATHERLOOM_KEYSTORE_FILE"
          gradle :app:assembleRelease --stacktrace
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Verify APK signature and package
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android/apk-signature.txt
          grep -Fqi 'c31ec8be3956258e35b852545d43607ea87cbeefa805593633fa0e522033940a' android/apk-signature.txt
          "$AAPT" dump badging "$APK" | tee android/apk-badging.txt
          grep -Fq "package: name='app.atherloom.react'" android/apk-badging.txt
          grep -Fq "versionCode='10'" android/apk-badging.txt
          grep -Fq "versionName='0.2.4-react-release'" android/apk-badging.txt
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED_TAG="v$(node -p 'require("./package.json").version')"
            test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          fi
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Atherloom-React-Android-release.apk
          sha256sum Atherloom-React-Android-release.apk > Atherloom-React-Android-release.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Atherloom-React-Android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/apk-signature.txt
            android/apk-badging.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Atherloom-React-Android-release.apk \
            Atherloom-React-Android-release.apk.sha256 \
            android/apk-signature.txt \
            android/apk-badging.txt \
            --title "Atherloom React $GITHUB_REF_NAME" \
            --notes "Atherloom React Android 固定签名版。v0.2.4 增加 Direct Provider 明文误配防护、长期世界 React 客户端，以及同一 Persona 的井字棋与猜拳链路。长期世界和 Casual Games 当前需要连接支持对应 API 的 FastAPI；Android 完全离线 Standalone 不伪装成已经支持。独立包名 app.atherloom.react，不会覆盖旧版 Atherloom；已安装固定签名版的设备可直接覆盖升级并保留应用数据。"
