name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/android-apk]
    tags: ["v*"]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Build React assets
        run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Compile installable debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signature and package
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android/apk-signature.txt
          "$AAPT" dump badging "$APK" | tee android/apk-badging.txt
          grep -Fq "package: name='app.atherloom.react'" android/apk-badging.txt
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Atherloom-React-Android-debug.apk
          sha256sum Atherloom-React-Android-debug.apk > Atherloom-React-Android-debug.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Atherloom-React-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/apk-signature.txt
            android/apk-badging.txt
          if-no-files-found: error
      - name: Publish private GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Atherloom-React-Android-debug.apk \
            Atherloom-React-Android-debug.apk.sha256 \
            android/apk-signature.txt \
            android/apk-badging.txt \
            --title "Atherloom React $GITHUB_REF_NAME" \
            --notes "Atherloom React Android 首个测试版。独立包名 app.atherloom.react，不会覆盖旧版。首次打开后请在设置中填写可访问的 FastAPI 后端地址。当前使用 Debug 签名，仅用于安装测试。"
