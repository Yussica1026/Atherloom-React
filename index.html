<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Atherloom" />
    <link rel="icon" href="./app-icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Atherloom</title>
    <script>document.documentElement.dataset.launchMode=performance.getEntriesByType("navigation")[0]?.type==="reload"?"refresh":"full";</script>
  </head>
  <body>
    <div class="launch-screen" id="launchScreen" role="status" aria-label="Atherloom 正在启动">
      <svg class="launch-mark" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" class="launch-tile" />
        <path pathLength="1" d="M111 377C151 290 190 200 240 117c8-14 25-14 34 0 50 83 89 173 129 260" class="launch-a launch-stroke" />
        <path pathLength="1" d="M141 324c73-3 158-24 230-84" class="launch-sweep launch-stroke" />
        <path pathLength="1" d="M237 148c20 64 47 114 91 153" class="launch-cut launch-stroke" />
        <path d="M352 142c7 38 17 48 55 55-38 7-48 17-55 55-7-38-17-48-55-55 38-7 48-17 55-55Z" class="launch-star" />
        <circle cx="420" cy="154" r="7" class="launch-spark spark-one" />
        <circle cx="399" cy="128" r="4" class="launch-spark spark-two" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
